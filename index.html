<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arc Agent Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f12;color:#f0f0f5;min-height:100vh;font-size:14px}
.app{max-width:900px;margin:0 auto;padding:24px 16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:50%;background:#1D9E75;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:16px;font-weight:600}
.logo-sub{font-size:12px;color:#9090a8}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.badge-ok{background:#0a2e22;color:#5DCAA5;border:1px solid #1D9E75}
.badge-wait{background:#2e1e06;color:#EF9F27;border:1px solid #EF9F27}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.stat{background:#18181f;border-radius:8px;padding:12px 14px}
.stat-label{font-size:11px;color:#5a5a72;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-val{font-size:20px;font-weight:600;color:#f0f0f5}
.stat-val.green{color:#1D9E75}
.add-section{background:#18181f;border-radius:10px;padding:16px;margin-bottom:16px}
.add-label{font-size:11px;color:#5a5a72;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.add-row{display:flex;gap:8px}
.addr-input{flex:1;height:38px;padding:0 12px;border:1px solid rgba(255,255,255,0.12);border-radius:6px;background:#0f0f12;color:#f0f0f5;font-size:12px;font-family:monospace}
.addr-input:focus{outline:none;border-color:#1D9E75}
.addr-input::placeholder{font-family:system-ui;color:#5a5a72;font-size:13px}
.btn{height:38px;padding:0 16px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.btn-green{background:#1D9E75;color:#fff}
.btn-green:hover{background:#17866a}
.err{margin-top:8px;padding:6px 10px;background:#2e100a;color:#F0997B;border-radius:6px;font-size:12px}
.agents{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.agent-card{background:#18181f;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s}
.agent-card:hover{border-color:rgba(255,255,255,0.15)}
.agent-card.active{border-color:#1D9E75}
.agent-row{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:14px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.agent-addr{font-size:11px;color:#5a5a72;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-right{text-align:right;flex-shrink:0}
.agent-bal{font-size:14px;font-weight:500}
.agent-nonce{font-size:11px;color:#5a5a72;margin-top:2px}
.tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px}
.tag-green{background:#0a2e22;color:#5DCAA5}
.tag-amber{background:#2e1e06;color:#EF9F27}
.tag-red{background:#2e100a;color:#F0997B}
.tag-blue{background:#0a1e38;color:#6EB3F7}
.tag-gray{background:#22222c;color:#9090a8}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn-rm{background:none;border:none;cursor:pointer;color:#5a5a72;padding:4px;border-radius:4px;font-size:14px;line-height:1}
.btn-rm:hover{color:#F0997B;background:#2e100a}
.detail{background:#18181f;border-radius:10px;overflow:hidden}
.detail-header{padding:20px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.detail-name{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.detail-addr{font-size:11px;color:#5a5a72;font-family:monospace;word-break:break-all}
.detail-bal{font-size:28px;font-weight:600;white-space:nowrap}
.detail-bal-label{font-size:12px;color:#5a5a72;text-align:right;margin-top:2px}
.detail-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.07);border-bottom:1px solid rgba(255,255,255,0.07)}
.meta-item{background:#18181f;padding:14px 16px}
.meta-label{font-size:11px;color:#5a5a72;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.meta-val{font-size:14px;font-weight:500}
.meta-link{color:#1D9E75;text-decoration:none;font-size:13px}
.meta-link:hover{text-decoration:underline}
.tx-section{padding:16px 20px}
.tx-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tx-title{font-size:11px;color:#5a5a72;text-transform:uppercase;letter-spacing:.05em}
.btn-ref{background:none;border:1px solid rgba(255,255,255,0.12);color:#9090a8;padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-ref:hover{background:#22222c}
.tx-list{display:flex;flex-direction:column}
.tx-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.tx-row:last-child{border-bottom:none}
.tx-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.tx-icon.out{background:#2e100a}
.tx-icon.in{background:#0a2e22}
.tx-icon.self{background:#0a1e38}
.tx-info{flex:1;min-width:0}
.tx-hash{font-size:12px;font-family:monospace;color:#f0f0f5;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-hash:hover{color:#1D9E75}
.tx-meta{font-size:11px;color:#5a5a72;margin-top:2px}
.tx-amt{font-size:13px;font-weight:500;flex-shrink:0}
.tx-amt.out{color:#F0997B}
.tx-amt.in{color:#1D9E75}
.tx-amt.self{color:#6EB3F7}
.center{text-align:center;padding:24px;color:#5a5a72;font-size:13px}
.faucet{margin:0 0 12px;padding:10px 14px;background:#0a1e38;border-radius:6px;font-size:12px;color:#6EB3F7}
.faucet a{color:#6EB3F7;font-weight:500}
.empty-main{text-align:center;padding:60px 20px;color:#5a5a72}
.empty-main h2{font-size:16px;font-weight:500;color:#9090a8;margin-bottom:8px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.detail-meta{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⬡</div>
      <div>
        <div class="logo-text">Arc Agent Tracker</div>
        <div class="logo-sub">Live on-chain · Arc testnet</div>
      </div>
    </div>
    <div class="badge badge-wait" id="nb">Connecting…</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total balance</div><div class="stat-val" id="s1">—</div></div>
    <div class="stat"><div class="stat-label">Wallets tracked</div><div class="stat-val green" id="s2">0</div></div>
    <div class="stat"><div class="stat-label">Latest block</div><div class="stat-val" id="s3">—</div></div>
    <div class="stat"><div class="stat-label">Chain ID</div><div class="stat-val">5042002</div></div>
  </div>

  <div class="add-section">
    <div class="add-label">Track a wallet</div>
    <div class="add-row">
      <input class="addr-input" id="ai" type="text" placeholder="0x… Arc testnet wallet address"/>
      <button class="btn btn-green" onclick="addAgent()">+ Track</button>
    </div>
    <div id="em"></div>
  </div>

  <div class="agents" id="al"></div>
  <div id="dp"></div>
</div>

<script>
const EXP="https://testnet.arcscan.app";
const RPC="/api/rpc";
let agents=[],sel=null;
const PAL=[["#1D9E75","#0a2e22"],["#6EB3F7","#0a1e38"],["#B07EF5","#1e1040"],["#F5A623","#2e1e06"],["#F0997B","#2e100a"]];

async function rpc(m,p=[]){
  const r=await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:m,params:p})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.result;
}
const h2d=h=>parseInt(h,16);
const w2e=h=>parseInt(h,16)/1e18;
const sa=a=>a.slice(0,8)+"…"+a.slice(-6);
const sh=h=>h.slice(0,10)+"…"+h.slice(-6);
function ago(ts){if(!ts)return"?";const d=Math.floor(Date.now()/1000)-ts;if(d<60)return d+"s ago";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";}

async function ping(){
  try{
    const b=await rpc("eth_blockNumber");
    document.getElementById("s3").textContent=h2d(b).toLocaleString();
    document.getElementById("nb").textContent="Arc testnet · live";
    document.getElementById("nb").className="badge badge-ok";
  }catch(e){
    document.getElementById("nb").textContent="RPC offline";
    document.getElementById("nb").className="badge badge-wait";
  }
}

function stats(){
  const ld=agents.filter(a=>a.ok);
  document.getElementById("s1").textContent=ld.length?ld.reduce((s,a)=>s+a.bal,0).toFixed(4)+" ETH":"—";
  document.getElementById("s2").textContent=agents.length;
}

function renderList(){
  const el=document.getElementById("al");
  if(!agents.length){el.innerHTML='<div class="center">Add a wallet address above to start tracking.</div>';return;}
  el.innerHTML=agents.map(a=>{
    const[c,bg]=PAL[a.ci];
    const ini=a.name.split(" ").map(w=>w[0]).slice(0,2).join("");
    let bt="—",tc="tag-amber",tt="loading";
    if(a.err){tc="tag-red";tt="error";}
    else if(a.ok){bt=a.bal.toFixed(4)+" ETH";tc="tag-green";tt="live";}
    return`<div class="agent-card${a.id===sel?" active":""}" onclick="pick(${a.id})">
      <div class="agent-row">
        <div class="avatar" style="background:${bg};color:${c}">${ini}</div>
        <div class="agent-info">
          <div class="agent-name">${a.name}${a.loading?'<span class="spin">↻</span>':""}</div>
          <div class="agent-addr">${sa(a.addr)}</div>
        </div>
        <div class="agent-right">
          <div class="agent-bal">${bt}</div>
          ${a.ok?`<div class="agent-nonce">nonce: ${a.nonce}</div>`:""}
        </div>
        <button class="btn-rm" onclick="event.stopPropagation();rm(${a.id})">✕</button>
      </div>
      <div class="tags">
        <span class="tag ${tc}">${tt}</span>
        <span class="tag tag-blue">chain 5042002</span>
        <span class="tag tag-gray">${a.addr.slice(0,8)}…</span>
      </div>
      ${a.err?`<div class="err">${a.err}</div>`:""}
    </div>`;
  }).join("");
}

function renderDetail(){
  const dp=document.getElementById("dp");
  const a=agents.find(x=>x.id===sel);
  if(!a){dp.innerHTML='<div class="empty-main"><h2>No wallet selected</h2><p>Add an Arc testnet address above to see live data.</p></div>';return;}
  const[c,bg]=PAL[a.ci];
  const ini=a.name.split(" ").map(w=>w[0]).slice(0,2).join("");
  let txhtml="";
  if(a.txl)txhtml='<div class="center"><span class="spin" style="font-size:20px">↻</span><br>Scanning blocks…</div>';
  else if(!a.txs)txhtml='<div class="center">Click refresh to load transactions.</div>';
  else if(!a.txs.length)txhtml=`<div class="center">No transactions found in last 150 blocks.<br><a href="${EXP}/address/${a.addr}" target="_blank" class="meta-link">View full history on Arcscan →</a></div>`;
  else txhtml=`<div class="tx-list">`+a.txs.map(tx=>{
    const al=a.addr.toLowerCase();
    let dir="self";
    if(tx.from?.toLowerCase()===al&&tx.to?.toLowerCase()!==al)dir="out";
    else if(tx.to?.toLowerCase()===al&&tx.from?.toLowerCase()!==al)dir="in";
    const ico=dir==="out"?"↗":dir==="in"?"↙":"⇄";
    const val=parseInt(tx.value,16)/1e18;
    const cp=dir==="out"?(tx.to?sa(tx.to):"contract"):(tx.from?sa(tx.from):"?");
    const lbl=dir==="out"?`To ${cp}`:dir==="in"?`From ${cp}`:"Self";
    const amt=(dir==="out"?"−":dir==="in"?"+":"")+val.toFixed(6)+" ETH";
    return`<div class="tx-row">
      <div class="tx-icon ${dir}">${ico}</div>
      <div class="tx-info">
        <a href="${EXP}/tx/${tx.hash}" target="_blank" class="tx-hash">${sh(tx.hash)}</a>
        <div class="tx-meta">${lbl} · ${ago(tx.ts)}</div>
      </div>
      <div class="tx-amt ${dir}">${amt}</div>
    </div>`;
  }).join("")+"</div>";

  dp.innerHTML=`<div class="detail">
    <div class="detail-header">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div class="avatar" style="background:${bg};color:${c};width:44px;height:44px;font-size:14px">${ini}</div>
        <div>
          <div class="detail-name">${a.name} <span class="tag ${a.ok?"tag-green":a.err?"tag-red":"tag-amber"}">${a.ok?"live":a.err?"error":"loading"}</span></div>
          <div class="detail-addr">${a.addr}</div>
        </div>
      </div>
      <div>
        <div class="detail-bal">${a.ok?a.bal.toFixed(6):"—"}</div>
        <div class="detail-bal-label">ETH · Arc testnet</div>
      </div>
    </div>
    <div class="detail-meta">
      <div class="meta-item"><div class="meta-label">Txs sent</div><div class="meta-val">${a.ok?a.nonce:"—"}</div></div>
      <div class="meta-item"><div class="meta-label">Network</div><div class="meta-val">Arc testnet</div></div>
      <div class="meta-item"><div class="meta-label">Explorer</div><div class="meta-val"><a href="${EXP}/address/${a.addr}" target="_blank" class="meta-link">Arcscan →</a></div></div>
    </div>
    <div class="tx-section">
      <div class="faucet">ℹ Get free testnet funds at <a href="https://faucet.circle.com" target="_blank">faucet.circle.com</a></div>
      <div class="tx-header">
        <div class="tx-title">Transaction history</div>
        <button class="btn-ref" onclick="ref(${a.id})">↻ Refresh</button>
      </div>
      ${txhtml}
    </div>
  </div>`;
}

async function loadW(a){
  a.loading=true;a.err=null;renderList();
  try{
    const[bh,nh]=await Promise.all([rpc("eth_getBalance",[a.addr,"latest"]),rpc("eth_getTransactionCount",[a.addr,"latest"])]);
    a.bal=w2e(bh);a.nonce=h2d(nh);a.ok=true;
  }catch(e){a.err=e.message.slice(0,60);}
  a.loading=false;renderList();stats();
  if(sel===a.id)renderDetail();
}

async function loadT(a){
  a.txl=true;renderDetail();
  try{
    const top=h2d(await rpc("eth_blockNumber"));
    const txs=[];
    for(let i=top;i>Math.max(0,top-150)&&txs.length<10;i-=3){
      const calls=[];
      for(let j=0;j<3&&(i-j)>0;j++)calls.push(rpc("eth_getBlockByNumber",["0x"+(i-j).toString(16),true]).catch(()=>null));
      const blocks=await Promise.all(calls);
      for(const blk of blocks){
        if(!blk?.transactions)continue;
        for(const tx of blk.transactions){
          const al=a.addr.toLowerCase();
          if(tx.from?.toLowerCase()===al||tx.to?.toLowerCase()===al){
            txs.push({...tx,ts:blk.timestamp?h2d(blk.timestamp):null});
            if(txs.length>=10)break;
          }
        }
        if(txs.length>=10)break;
      }
    }
    a.txs=txs;
  }catch(e){a.txs=[];}
  a.txl=false;renderDetail();
}

function pick(id){
  sel=id;renderList();
  const a=agents.find(x=>x.id===id);
  if(a&&!a.txs&&!a.txl)loadT(a);
  renderDetail();
}

function ref(id){
  const a=agents.find(x=>x.id===id);
  if(!a)return;
  a.txs=null;loadW(a);loadT(a);
}

async function addAgent(){
  const inp=document.getElementById("ai");
  const em=document.getElementById("em");
  const val=inp.value.trim();
  em.innerHTML="";
  if(!val)return;
  if(!/^0x[0-9a-fA-F]{40}$/.test(val)){em.innerHTML='<div class="err">Invalid address — needs 0x + 40 hex characters.</div>';return;}
  if(agents.find(a=>a.addr.toLowerCase()===val.toLowerCase())){em.innerHTML='<div class="err">Already tracking this address.</div>';return;}
  const id=Date.now();
  const a={id,name:`Agent #${agents.length+1}`,addr:val,ci:agents.length%PAL.length,bal:0,nonce:0,loading:false,ok:false,err:null,txs:null,txl:false};
  agents.push(a);sel=id;inp.value="";
  renderList();renderDetail();stats();
  await loadW(a);loadT(a);
}

function rm(id){
  agents=agents.filter(a=>a.id!==id);
  if(sel===id)sel=agents.length?agents[0].id:null;
  renderList();renderDetail();stats();
}

document.getElementById("ai").addEventListener("keydown",e=>{if(e.key==="Enter")addAgent();});
renderList();renderDetail();
ping();
</script>
</body>
</html>
